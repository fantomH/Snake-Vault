{% extends "base.html" %}

{% block content %}

<h1>Questionnaires</h1>

<div class="list-group mt-4">
    {% for questionnaire in questionnaires %}
        <a
            href="{{ url_for('snake_flask_quiz.take_quiz', name=questionnaire.name) }}"
            class="list-group-item list-group-item-action"
        >
            {{ questionnaire.title }}
        </a>
    {% endfor %}
</div>

{% endblock %}
